<svg xmlns="http://www.w3.org/2000/svg" width="320" height="150" viewBox="0 0 320 150" role="img" aria-label="Ağ Bağlantıları Yöneticisi">
  <style>
    @keyframes sweep{to{stroke-dashoffset:-1000}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .sweep{stroke-dasharray:120 880;animation:sweep 7s linear infinite;animation-delay:-5.1s}
    .icon{animation:bob 3.2s ease-in-out infinite;animation-delay:-5.1s}
    .txt{animation:fade .7s both}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect x="1" y="1" width="318" height="148" rx="16" fill="#2b2d31" stroke="#3f4147"/>
  <rect class="sweep" x="1" y="1" width="318" height="148" rx="16" fill="none" stroke="#5865f2" stroke-width="2" pathLength="1000"/>
  <rect x="20" y="20" width="44" height="44" rx="12" fill="#5865f2" fill-opacity=".18"/>
  <g class="icon"><g fill="none" stroke="#5865f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" transform="translate(30 30)"><rect x="9" y="2" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="16" y="16" width="6" height="6" rx="1"/><path d="M12 8v4M5 16v-4h14v4"/></g></g>
  <text class="txt" x="20" y="96" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#f2f3f5">Ağ Bağlantıları Yöneticisi</text>
  <text class="txt" style="animation-delay:.12s" x="20" y="120" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" fill="#b5bac1">Windows ağ bağdaştırıcılarını</text>
  <text class="txt" style="animation-delay:.2s" x="20" y="138" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" fill="#b5bac1">tek yerden yönetir</text>
</svg>
