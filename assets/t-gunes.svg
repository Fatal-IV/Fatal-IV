<svg xmlns="http://www.w3.org/2000/svg" width="800" height="150" viewBox="0 0 800 150" role="img" aria-label="güneş">
<defs><clipPath id="c"><rect x="1" y="1" width="798" height="148" rx="26"/></clipPath>
<clipPath id="av"><circle cx="88" cy="75" r="46"/></clipPath>
<linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5865f2" stop-opacity=".5"/><stop offset="1" stop-color="#5865f2" stop-opacity="0"/></radialGradient>
<linearGradient id="e" x1="0" x2="1"><stop offset="0" stop-color="#5865f2"/><stop offset="1" stop-color="#9aa3ff"/></linearGradient></defs>
<style>@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.8}}
@keyframes shine{from{transform:translateX(-200px) skewX(-18deg)}to{transform:translateX(1000px) skewX(-18deg)}}
.g{animation:pulse 4s ease-in-out infinite}.sh{animation:shine 8s ease-in-out infinite;animation-delay:2s}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x="1" y="1" width="798" height="148" rx="26" fill="#2b2d31" stroke="#fff" stroke-opacity=".14"/>
<g clip-path="url(#c)"><rect width="800" height="150" fill="url(#top)"/><ellipse class="g" cx="88" cy="150" rx="150" ry="60" fill="url(#gl)"/><rect class="sh" x="0" y="0" width="120" height="150" fill="url(#sh)"/><rect width="800" height="3" fill="url(#e)"/></g>
<circle cx="88" cy="75" r="51" fill="none" stroke="url(#e)" stroke-width="3"/>
<image x="42" y="29" width="92" height="92" clip-path="url(#av)" preserveAspectRatio="xMidYMid slice" href="data:image/jpeg;base64,"/>
<text x="168" y="68" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#f2f3f5">güneş</text>
<rect x="168" y="78" width="40" height="3" rx="1.5" fill="#5865f2" fill-opacity=".7"/>
<text x="168" y="106" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" fill="#b5bac1">Emeği, fikirleri, desteği ve sevgisi ile her zaman yanımda</text>
</svg>