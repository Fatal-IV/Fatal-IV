<svg xmlns="http://www.w3.org/2000/svg" width="152" height="168" viewBox="0 0 152 168" role="img" aria-label="WinGuard">
<defs><clipPath id="c"><rect x="1" y="1" width="150" height="150" rx="22"/></clipPath>
<linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5865f2" stop-opacity=".55"/><stop offset="1" stop-color="#5865f2" stop-opacity="0"/></radialGradient>
<linearGradient id="e" x1="0" x2="1"><stop offset="0" stop-color="#5865f2"/><stop offset="1" stop-color="#9aa3ff"/></linearGradient></defs>
<style>@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes sweep{from{transform:translateX(-260px) skewX(-20deg)}to{transform:translateX(1100px) skewX(-20deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}@keyframes shine{from{transform:translateX(-90px) skewX(-18deg)}to{transform:translateX(260px) skewX(-18deg)}}
.f{animation:bob 4s ease-in-out infinite;animation-delay:0.90s}.sh{animation:shine 7s ease-in-out infinite;animation-delay:1.6s}.g{animation:pulse 4s ease-in-out infinite;animation-delay:1.0s}</style>
<g class="f">
<rect x="1" y="1" width="150" height="150" rx="22" fill="#2b2d31" stroke="#fff" stroke-opacity=".14"/>
<g clip-path="url(#c)"><rect width="152" height="152" fill="url(#top)"/><ellipse class="g" cx="76" cy="150" rx="70" ry="34" fill="url(#gl)"/><rect class="sh" x="0" y="0" width="52" height="152" fill="url(#sh)"/><rect width="152" height="3" fill="url(#e)"/></g>
<rect x="49" y="18" width="54" height="54" rx="17" fill="#5865f2" fill-opacity=".22" stroke="#9aa3ff" stroke-opacity=".5"/>
<g fill="none" stroke="#dfe2ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(54.5 23.5) scale(1.8)"><path d="M12 2l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10V5z"/><path d="M8.5 12l2.5 2.5L16 9.5"/></g>
<text x="76" y="102" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#f2f3f5">WinGuard</text>
<text x="76" y="122" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" fill="#b5bac1">Hırsızlığa karşı koruma</text>
<rect x="56" y="134" width="40" height="3" rx="1.5" fill="#5865f2" fill-opacity=".6"/>
</g></svg>